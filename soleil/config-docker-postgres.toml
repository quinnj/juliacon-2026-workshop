# The docker_server_demo.sh profile for postgres state. Its secrets exist only in
# the demo's throwaway containers.
[state]
backend = "postgres"

[state.postgres]
host = "postgres"
password = "postgres"
database = "soleil"

[events]
enabled = true
webhook_secret = "soleil-demo-weather-secret"

[events.nats]
url = "nats://nats:4222"
