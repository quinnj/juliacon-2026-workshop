# Base configuration. A `PORT` environment variable, a `--port=...` argument, or
# a profile's config file overrides it.
port = 9001

# The directory for Soleil's JSON state files, relative to this one.
[state]
path = "state"

# Weather events need a NATS server, so they are off unless enabled. Set
# `events.webhook_secret` from a secret source such as `.config-<profile>.toml`.
[events]
enabled = false
# Tempus cron fields: second minute hour day month weekday (hourly here).
cleanup_schedule = "0 0 * * * *"
logging = true

[events.nats]
url = "nats://127.0.0.1:4222"
